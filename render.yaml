# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: render.com -> New -> Blueprint -> pick this repository.
#
# The free plan works here because RSVP mail goes out over HTTPS (Brevo), not
# SMTP: Render blocks outbound SMTP on ports 25/465/587 for free services.
# Free services have no persistent disk, so data/rsvps.jsonl lives only as long
# as the instance — it is a backup of the emails, not the system of record.
# Add a disk (paid instance type) if the /admin dashboard must survive redeploys.
services:
  - type: web
    name: kishin-jessica-invitation
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: FROM_NAME
        value: Kishin & Jessica
      - key: BREVO_API_KEY
        sync: false
      # Must match the sender address verified in Brevo (Senders, Domains and IPs).
      - key: RSVP_FROM_EMAIL
        sync: false
      - key: RSVP_TO_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
